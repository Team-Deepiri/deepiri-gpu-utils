[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepiri-gpu-utils"
version = "0.3.0"
description = "Reusable GPU detection, inventory, health, selection, and runtime primitives"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
deepiri-gpu = "deepiri_gpu_utils.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
addopts = "-q"
