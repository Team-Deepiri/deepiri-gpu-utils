name: CI - deepiri-gpu-utils

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: GPU health gate
        run: scripts/ci-health-gate.sh gpu-health.json

      - name: Upload GPU health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-health-${{ github.run_id }}
          path: gpu-health.json
          if-no-files-found: error

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest
